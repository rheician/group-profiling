<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${victory} ? 'Bad Ending? — Wonder of U' : 'Pursue Wonder of U'">Wonder of U</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            background: #080a0f;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .hunt-screen,
        .bad-ending {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 1.5rem;
            text-align: center;
        }

        .hunt-title,
        .bad-ending-title {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 900;
            letter-spacing: .08em;
        }

        .hunt-feedback {
            margin: 0;
            color: #cbd5e1;
            font-size: .9rem;
        }

        .hunt-feedback {
            color: #ffe96b;
            font-weight: 700;
        }

        .hunt-grid {
            display: grid;
            width: min(88vw, 500px);
            height: min(88vw, 500px);
            aspect-ratio: 1;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-template-rows: repeat(5, minmax(0, 1fr));
            overflow: hidden;
            border: 3px solid #fff;
            background: #fff;
        }

        .grid-cell {
            display: grid;
            min-width: 0;
            min-height: 0;
            place-items: center;
            padding: 4px;
            border: 1px solid #5b3825;
            background: #bd8a61;
            cursor: pointer;
        }

        .grid-cell:hover,
        .grid-cell:focus-visible {
            background: #e2bd98;
            outline: 2px solid #7b3f1d;
            outline-offset: -3px;
        }

        .wou-target {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .bad-ending {
            background:
                radial-gradient(ellipse at 50% 45%, rgba(84, 36, 44, .45), transparent 58%),
                #080a0f;
        }

        .bad-ending-title {
            color: #f4e3d7;
            text-shadow: 0 0 20px rgba(183, 54, 68, .55);
        }

        .bad-ending-image {
            display: block;
            width: auto;
            max-width: min(88vw, 620px);
            max-height: 62vh;
            object-fit: contain;
        }

        .return-link {
            display: inline-block;
            border: 2px solid #fff;
            background: #fff;
            color: #080a0f;
            padding: .8rem 1.2rem;
            font-size: .8rem;
            font-weight: 900;
            letter-spacing: .12em;
            text-decoration: none;
        }

        .return-link:hover,
        .return-link:focus-visible {
            border-color: #ffe96b;
            background: #ffe96b;
        }

        @media (max-width: 480px) {
            .hunt-screen,
            .bad-ending {
                gap: 1rem;
                padding: 1rem;
            }

            .grid-cell {
                padding: 2px;
            }
        }
    </style>
</head>
<body>
<main th:unless="${victory}" class="hunt-screen">
    <h1 class="hunt-title">Pursue Wonder of U</h1>
    <p th:if="${miss}" class="hunt-feedback" role="status">Not there. Try again.</p>
    <form class="hunt-grid" method="post" th:action="@{/portfolio/radcliff/games/wonder-of-u/find}">
        <button th:each="cell : ${#numbers.sequence(0, 24)}"
                type="submit" class="grid-cell" name="cell" th:value="${cell}"
                th:attr="aria-label=|Grid cell ${cell + 1}|">
            <img th:if="${cell == targetCell}" class="wou-target" src="/images/WOU_1.png" alt="Wonder of U">
        </button>
    </form>
</main>

<main th:if="${victory}" class="bad-ending">
    <h1 class="bad-ending-title">Bad Ending?</h1>
    <img class="bad-ending-image" src="/images/WOU_BadEnd.png" alt="Wonder of U bad ending">
    <a class="return-link" href="/portfolio/radcliff">RETURN TO PROFILE</a>
</main>
</body>
</html>

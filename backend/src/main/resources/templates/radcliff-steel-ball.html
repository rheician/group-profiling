<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${victory} ? 'Victory — Steel Ball' : 'Steel Ball — Radcliff’s Portfolio'">Steel Ball</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            background: #05070d;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .shoot-form {
            min-height: 100vh;
        }

        .shoot-screen {
            position: relative;
            display: block;
            width: 100%;
            height: 100vh;
            height: 100svh;
            min-height: 420px;
            overflow: hidden;
            border: 0;
            background:
                radial-gradient(ellipse at 50% 38%, rgba(35, 57, 91, .88), transparent 49%),
                linear-gradient(180deg, #101a2e, #05070d 78%);
            cursor: crosshair;
        }

        .scene-instruction {
            position: absolute;
            z-index: 5;
            top: 1.25rem;
            left: 50%;
            color: #e8f4ff;
            font-size: .75rem;
            font-weight: 900;
            letter-spacing: .22em;
            text-shadow: 0 2px 8px #000;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .funny-valentine {
            position: absolute;
            z-index: 2;
            top: 37%;
            left: 50%;
            z-index: 2;
            width: auto;
            height: min(68vh, 680px);
            max-width: 82vw;
            object-fit: contain;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .shot-line {
            position: absolute;
            z-index: 3;
            top: 58%;
            left: 50%;
            width: 4px;
            height: 25%;
            background: linear-gradient(180deg, #8eeaff, #168bff 60%, rgba(22, 139, 255, .1));
            box-shadow: 0 0 14px 4px rgba(27, 149, 255, .72);
            pointer-events: none;
            transform: translateX(-50%);
        }

        .steel-ball-scene {
            position: absolute;
            z-index: 4;
            bottom: 6%;
            left: 50%;
            width: clamp(72px, 12vw, 128px);
            aspect-ratio: 1;
            transform: translateX(-50%);
        }

        .steel-ball {
            position: absolute;
            z-index: 1;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .spin-effect {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            width: 200%;
            height: 150%;
            background-image: url("/images/Spin%20Effect.png");
            background-repeat: no-repeat;
            background-size: 300% 200%;
            background-position: 0 0;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .victory-screen {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 1.5rem;
            background:
                radial-gradient(ellipse at 50% 45%, rgba(83, 39, 93, .6), transparent 60%),
                #05070d;
            text-align: center;
        }

        .victory-title {
            margin: 0;
            color: #ffe96b;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            letter-spacing: .12em;
            text-shadow: 0 0 22px rgba(255, 233, 107, .5);
        }

        .victory-images {
            display: grid;
            width: min(100%, 980px);
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: center;
            gap: 1rem;
        }

        .victory-images img {
            display: block;
            width: 100%;
            max-height: 58vh;
            object-fit: contain;
        }

        .return-link {
            display: inline-block;
            border: 2px solid #fff;
            background: #fff;
            color: #05070d;
            padding: .8rem 1.2rem;
            font-size: .8rem;
            font-weight: 900;
            letter-spacing: .12em;
            text-decoration: none;
        }

        .return-link:hover,
        .return-link:focus-visible {
            background: #ffe96b;
            border-color: #ffe96b;
        }

        @media (max-width: 520px) {
            .scene-instruction {
                font-size: .65rem;
            }

            .victory-images {
                gap: .5rem;
            }
        }
    </style>
</head>
<body>
<form th:unless="${victory}" class="shoot-form" method="post"
      th:action="@{/portfolio/radcliff/games/steel-ball/shoot}">
    <button class="shoot-screen" type="submit" aria-label="Click anywhere to shoot the Steel Ball">
        <span class="scene-instruction" aria-hidden="true">Shoot the President</span>
        <img class="funny-valentine" src="/images/FunnyValentine.png" alt="">
        <span class="shot-line" aria-hidden="true"></span>
        <span class="steel-ball-scene" aria-hidden="true">
            <img class="steel-ball" src="/images/Steel%20Ball.png" alt="">
            <span class="spin-effect"></span>
        </span>
    </button>
</form>

<main th:if="${victory}" class="victory-screen">
    <h1 class="victory-title">VICTORY</h1>
    <div class="victory-images">
        <img src="/images/Tusk_act_4_manga_panel.png" alt="Tusk Act 4 manga panel">
        <img src="/images/Tusk_Act4_Barrage.png" alt="Tusk Act 4 barrage">
    </div>
    <a class="return-link" href="/portfolio/radcliff">RETURN TO PROFILE</a>
</main>
<script src="/js/steel-ball.js" defer></script>
</body>
</html>

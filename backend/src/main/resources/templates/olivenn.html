<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jahn Olivenn Esmarin — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070b18;
            --accent: #ff6b35;
            --sage: #aec3b0;
            --font: 'Covered By Your Grace', cursive;
            /* Figma frame is 1920 wide: 1vw = 19.2 design px */
            --hero-size: min(128px, 6.667vw);
            --nav-size: clamp(14px, 1.667vw, 32px);
            --nav-h: calc(var(--hero-size) * 0.5 + 24px);   /* approx. nav height, used for spacing below it */
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            background: var(--bg);
            color: #fff;
            font-family: var(--font);
        }

        body { overflow-x: hidden; }

        html { scroll-snap-type: y proximity; }

        main { position: relative; z-index: 1; }

        /* Every section fills the whole viewport, like the landing page */
        .screen {
            position: relative;
            height: 100vh;
            height: 100svh;
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
            background: transparent;
            scroll-snap-align: start;
        }

        /* One fixed forest backdrop (Figma "forest" layer, 15% opacity) shared by
           every section, so it never re-appears or scrolls while you move down */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url('/images/forest.png') center / cover no-repeat;
            opacity: 0.15;
            pointer-events: none;
        }

        /* Floating nav: stays on screen for the whole page */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 0 2vw;
            background: rgba(7, 11, 24, 0);          /* fades in with scroll (JS) */
            -webkit-backdrop-filter: blur(0px);
            backdrop-filter: blur(0px);
        }

        .nav-inner {
            position: relative;
            padding: 10px 0 4px;                       /* tight space above the line */
            border-bottom: 1px solid rgba(174, 195, 176, 0.55);
        }

        .nav-row {
            min-height: calc(var(--hero-size) * 0.5);  /* room for the title once it docks */
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: var(--nav-size);
            line-height: 1;
            color: var(--sage);
        }

        .nav-row a { color: inherit; text-decoration: none; }
        .nav-row a:hover { text-decoration: underline; }

        /* Single title element that travels from the hero centre (screen 1)
           into the floating nav bar as the page scrolls. */
        #name {
            position: fixed;
            left: 50%;
            top: 50vh;
            z-index: 11;
            margin: 0;
            font-weight: 400;
            font-size: var(--hero-size);
            letter-spacing: 0.1em;
            line-height: 1;
            white-space: nowrap;
            text-align: center;
            color: var(--accent);
            text-shadow: 0 15px 35px rgba(255, 107, 53, 0.35);
            transform: translate(-50%, -50%);
            will-change: top, font-size;
            pointer-events: none;
        }

        /* Second text that appears once the name has moved up */
        #headline {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 2;
            margin: 0;
            width: 92%;
            font-weight: 400;
            font-size: var(--hero-size);
            letter-spacing: 0.1em;
            line-height: 1.1;
            text-align: center;
            color: #fff;
            opacity: 0;
            transform: translate(-50%, calc(-50% + 24px));
            will-change: opacity, transform;
        }


        /* Frame 2 button ("1, 2, 3...") — sits under the headline, fades in with it */
        #go-btn {
            position: absolute;
            left: 50%;
            top: calc(50% + var(--hero-size) * 1.086);
            z-index: 2;
            min-width: min(437px, 90vw);
            height: calc(var(--nav-size) * 1.9);
            padding: 0 1.5em;
            font: inherit;
            font-size: var(--nav-size);
            letter-spacing: 0.1em;
            color: var(--bg);
            background: var(--accent);
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, calc(-50% + 24px));
            will-change: opacity, transform;
            transition: filter .15s;
        }

        #go-btn:hover { filter: brightness(1.12); }

        /* Frame 3 "Missing Adults" — hidden until the button above is clicked.
           Everything inside the board is positioned in % / cqw of the Figma
           board (1366 x 768), so it scales with the board. */
        #screen-3 {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(var(--nav-h) + 1vh) 2vw 2vh;
        }

        #screen-3.is-hidden { display: none; }

        #screen-3.reveal .board { animation: board-in .7s ease both; }

        @keyframes board-in {
            from { opacity: 0; transform: translateY(32px); }
            to   { opacity: 1; transform: none; }
        }

        .board {
            position: relative;
            z-index: 2;
            width: min(71.15vw, calc((100svh - var(--nav-h) - 3vh) * 1366 / 768));
            aspect-ratio: 1366 / 768;
            container-type: inline-size;
        }

        .board > img.bg,
        .board .pad,
        .board .face {
            position: absolute;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        .board > img.bg { inset: 0; width: 100%; height: 100%; object-fit: cover; }

        .board h2 {
            position: absolute;
            left: 50%;
            top: 15.75%;
            margin: 0;
            width: 100%;
            font-weight: 400;
            font-size: 9.37cqw;
            letter-spacing: 0.1em;
            line-height: 1;
            text-align: center;
            color: #fff;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        .board .pad  { top: 30.99%; width: 16.03%; height: 40.49%; object-fit: cover; }
        .board .face { width: 13.03%; aspect-ratio: 1; object-fit: cover; }

        .board .mark {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 15.74%;
            font-size: 14.35cqw;
            line-height: 1;
            letter-spacing: 0.01em;
            color: var(--bg);
            text-shadow: 0 15px 35px rgba(255, 107, 53, 0.35);
            transform: translate(-50%, -50%) rotate(-45deg);
            pointer-events: none;
            user-select: none;
        }

        .board .hanapin {
            position: absolute;
            left: 41.36%;
            top: 81.51%;
            width: 17.28%;
            height: 7.94%;
            padding: 0;
            font: inherit;
            font-size: 2.34cqw;
            letter-spacing: 0.1em;
            color: var(--bg);
            background: var(--accent);
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            transition: filter .15s;
        }

        .board .hanapin:hover { filter: brightness(1.12); }

        /* Leave Message section (last on the page) */
        #leave-message {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: calc(var(--nav-h) + 4vh) 6vw 6vh;
        }

        .message-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 560px;
        }

        .message-card h2 {
            margin: 0 0 8px;
            font-weight: 400;
            font-size: clamp(36px, 4.4vw, 84px);
            letter-spacing: 0.1em;
            line-height: 1.1;
            text-align: center;
            color: #fff;
        }

        .message-card p.sub {
            margin: 0 0 28px;
            text-align: center;
            font-size: clamp(16px, 1.667vw, 28px);
            color: var(--sage);
        }

        .status {
            margin: 0 0 20px;
            padding: 10px 18px;
            border: 1px solid var(--sage);
            border-radius: 9999px;
            text-align: center;
            font-size: clamp(15px, 1.4vw, 24px);
            color: var(--accent);
            background: rgba(7, 11, 24, 0.85);
        }

        .status a { color: inherit; font-weight: 700; }

        .message-card form { display: grid; gap: 14px; }

        .message-card input,
        .message-card textarea {
            width: 100%;
            padding: 12px 14px;
            font: inherit;
            font-size: clamp(16px, 1.5vw, 26px);
            color: #fff;
            background: rgba(174, 195, 176, 0.08);
            border: 1px solid rgba(174, 195, 176, 0.55);
            border-radius: 10px;
            outline: none;
        }

        .message-card input::placeholder,
        .message-card textarea::placeholder { color: rgba(174, 195, 176, 0.7); }

        .message-card input:focus,
        .message-card textarea:focus { border-color: var(--accent); }

        .message-card textarea { resize: vertical; min-height: 120px; }

        .message-card button {
            padding: 12px 18px;
            font: inherit;
            font-size: clamp(18px, 1.8vw, 30px);
            letter-spacing: 0.1em;
            color: var(--bg);
            background: var(--accent);
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            transition: filter .15s;
        }

        .message-card button:hover { filter: brightness(1.12); }

        /* No JavaScript: show the final state of screen 2 */
        .no-js #name { display: none; }
        .no-js #headline { opacity: 1; transform: translate(-50%, -50%); }
        .no-js .nav-title { display: block; }
        .no-js #go-btn { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
        .no-js #screen-3.is-hidden { display: flex; }

        .nav-title {
            display: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: calc(var(--hero-size) / 2);
            letter-spacing: 0.1em;
            white-space: nowrap;
            color: var(--accent);
            text-shadow: 0 15px 35px rgba(255, 107, 53, 0.35);
        }
    </style>
</head>
<body class="no-js">

<div class="backdrop" aria-hidden="true"></div>

<main id="stage">

    <!-- Floating nav (always visible) -->
    <header class="nav">
        <div class="nav-inner">
            <div class="nav-row" id="nav-row">
                <a href="/">Back to Home</a>
                <span>November 2026</span>
            </div>
            <span class="nav-title">JAHN OLIVENN ESMARIN</span>
        </div>
    </header>

    <!-- Group Profiling 1 -->
    <section id="screen-1" class="screen"></section>

    <!-- Group Profiling 2 -->
    <section id="screen-2" class="screen">
        <h2 id="headline">99 NIGHTS NG ANO?</h2>
        <button type="button" id="go-btn">1, 2, 3... Go Kanya Kanya Na To!</button>
    </section>

    <!-- Group Profiling 3: Missing Adults (revealed by the button in screen 2) -->
    <section id="screen-3" class="screen is-hidden" aria-label="Missing Adults">
        <div class="board">
            <img class="bg" src="/images/woodboard.png" alt="" />
            <h2>MISSING ADULTS</h2>
            <img class="pad" style="left:4.1%" src="/images/yellowpad.png" alt="" />
            <img class="pad" style="left:23.06%" src="/images/yellowpad.png" alt="" />
            <img class="pad" style="left:42.02%" src="/images/yellowpad.png" alt="" />
            <img class="pad" style="left:60.91%" src="/images/yellowpad.png" alt="" />
            <img class="pad" style="left:79.87%" src="/images/yellowpad.png" alt="" />
            <img class="face" style="left:5.64%;top:38.41%" src="/images/joy.png" alt="Joy" />
            <img class="face" style="left:24.6%;top:39.71%" src="/images/fear.png" alt="Fear" />
            <img class="face" style="left:43.48%;top:39.58%" src="/images/anger.png" alt="Anger" />
            <img class="face" style="left:62.44%;top:40.76%" src="/images/sadness.png" alt="Sadness" />
            <img class="face" style="left:81.4%;top:39.58%" src="/images/disgust.png" alt="Disgust" />
            <span class="mark" style="left:12.14%;top:51.15%" aria-hidden="true">???</span>
            <span class="mark" style="left:31.1%;top:53.88%" aria-hidden="true">???</span>
            <span class="mark" style="left:49.99%;top:51.15%" aria-hidden="true">???</span>
            <span class="mark" style="left:68.95%;top:54.93%" aria-hidden="true">???</span>
            <span class="mark" style="left:89.37%;top:52.59%" aria-hidden="true">???</span>
            <button type="button" class="hanapin" id="hanapin">#Hanapin</button>
        </div>
    </section>

    <!-- Leave Message (very end of the page) -->
    <section id="leave-message" class="screen" th:attr="data-sent=${sent}">
        <div class="message-card">
            <h2>Leave a Message</h2>
            <p class="sub">Say something to Olivenn.</p>

            <div class="status" th:if="${sent}">
                Message saved in Spring Boot! View it on the <a href="/">Dashboard Alerts</a>.
            </div>

            <form action="/feedback" method="post">
                <input type="hidden" name="recipient" value="Olivenn" />
                <input type="text" name="name" required placeholder="Your Name" />
                <input type="email" name="email" required placeholder="Your Email" />
                <textarea name="message" required rows="4" placeholder="Write a message..."></textarea>
                <button type="submit">Send to Spring Boot</button>
            </form>
        </div>
    </section>

    <!-- Moves from screen 1's centre into screen 2's nav bar while scrolling -->
    <h1 id="name">JAHN OLIVENN ESMARIN</h1>
</main>

<script>
    (function () {
        document.body.classList.remove('no-js');

        var name = document.getElementById('name');
        var headline = document.getElementById('headline');
        var nav = document.querySelector('.nav');
        var navRow = document.getElementById('nav-row');
        var screen2 = document.getElementById('screen-2');
        var goBtn = document.getElementById('go-btn');
        var screen3 = document.getElementById('screen-3');

        var startY, endY, startSize, endSize, distance;

        function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

        function measure() {
            startSize = Math.min(128, window.innerWidth * 0.06667);
            endSize = startSize / 2;
            startY = window.innerHeight / 2;
            var r = navRow.getBoundingClientRect();          // nav is fixed: viewport coords
            endY = r.top + r.height / 2;
            distance = Math.max(1, screen2.offsetTop);
        }

        function update() {
            var p = clamp(window.scrollY / distance, 0, 1);
            var e = ease(p);

            name.style.top = lerp(startY, endY, e) + 'px';
            name.style.fontSize = lerp(startSize, endSize, e) + 'px';

            // nav gets a backdrop as it becomes the persistent header
            nav.style.background = 'rgba(7, 11, 24, ' + (0.88 * e) + ')';
            var blur = 'blur(' + (8 * e) + 'px)';
            nav.style.backdropFilter = blur;
            nav.style.webkitBackdropFilter = blur;

            // second text fades/rises in during the last part of the scroll
            var t = clamp((p - 0.55) / 0.45, 0, 1);
            headline.style.opacity = t;
            headline.style.transform =
                'translate(-50%, calc(-50% + ' + (1 - t) * 24 + 'px))';

            // the button fades/rises in together with the headline
            goBtn.style.opacity = t;
            goBtn.style.transform =
                'translate(-50%, calc(-50% + ' + (1 - t) * 24 + 'px))';
            goBtn.style.pointerEvents = t > 0.9 ? 'auto' : 'none';
        }

        var ticking = false;
        function onScroll() {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () { ticking = false; update(); });
        }

        function onResize() { measure(); update(); }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onResize);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(onResize);
        onResize();

        // Frame 2 button: reveal Frame 3, then scroll down to it.
        goBtn.addEventListener('click', function () {
            screen3.classList.remove('is-hidden');
            screen3.classList.add('reveal');
            var reduce = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            screen3.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
        });

        // After submitting the form the page reloads at the top; jump back to it.
        var leave = document.getElementById('leave-message');
        if (leave && leave.getAttribute('data-sent') === 'true') {
            leave.scrollIntoView();
        }
    })();
</script>
</body>
</html>

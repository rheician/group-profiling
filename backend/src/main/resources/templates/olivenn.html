<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jahn Olivenn Esmarin — Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=NATS&family=Reenie+Beanie&family=Sarina&family=Sekuya&display=swap');

        :root {
            --pink: #ff0077;
            --pink-glint: #ffb3d6;
            --bg: #0d1a15;
            --sage: #618764;
        }

        body {
            background-color: var(--bg);
            color: var(--pink);
            margin: 0;
            overflow-x: hidden;
        }

        @keyframes olivenn-shimmer {
            from { background-position: 100% 0; }
            to   { background-position: 0% 0; }
        }

        @keyframes font-spin {
            0%, 15%   { font-family: 'Reenie Beanie', cursive; }
            16%, 32%  { font-family: 'Sarina', cursive; }
            33%, 48%  { font-family: 'Sekuya', sans-serif; }
            49%, 65%  { font-family: 'Reenie Beanie', cursive; }
            66%, 82%  { font-family: 'Sarina', cursive; }
            83%, 100% { font-family: 'Sekuya', sans-serif; }
        }

        .shimmer-title {
            font-family: 'Sekuya', sans-serif;
            font-size: 5.2vw;
            line-height: normal;
            white-space: nowrap;
            color: transparent;
            background-image: linear-gradient(90deg, var(--pink) 0%, var(--pink) 40%, var(--pink-glint) 50%, var(--pink) 60%, var(--pink) 100%);
            background-size: 250% 100%;
            background-repeat: no-repeat;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: olivenn-shimmer 4.2s linear infinite;
        }

        @keyframes streak-fall {
            0%   { transform: translateY(-120%) scaleY(0.6); opacity: 0; }
            30%  { opacity: 0.85; }
            100% { transform: translateY(120vh) scaleY(1.4); opacity: 0; }
        }

        .lightfall-backdrop {
            background: radial-gradient(ellipse at 50% 0%, rgba(156, 176, 128, 0.18) 0%, rgba(13, 26, 21, 0) 65%);
        }

        .streak {
            position: absolute;
            top: 0;
            width: 2px;
            height: 180px;
            border-radius: 9999px;
            background: linear-gradient(to bottom, transparent, #ffc2dd, #ff7ab8, #ff0077);
            box-shadow: 0 0 12px #ff7ab8;
            animation: streak-fall linear infinite;
        }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between">

<!-- Original interactive WebGL Lightfall effect, ported from React into vanilla JS.
     The existing CSS streaks remain as a fallback for browsers without WebGL2. -->
<div id="lightfall-container" class="pointer-events-none fixed inset-0 z-0 overflow-hidden" aria-hidden="true" style="background: radial-gradient(ellipse at 50% 0%, rgba(156,176,128,.18), transparent 65%);">
    <canvas id="lightfall-canvas" style="display:block;width:100%;height:100%;"></canvas>
</div>
<div id="lightfall-fallback" class="hidden lightfall-backdrop pointer-events-none fixed inset-0 z-0 overflow-hidden" aria-hidden="true">
    <span class="streak" style="left: 8%;  animation-duration: 3.4s; animation-delay: 0.1s;"></span>
    <span class="streak" style="left: 19%; animation-duration: 2.7s; animation-delay: 1.2s;"></span>
    <span class="streak" style="left: 31%; animation-duration: 4.1s; animation-delay: 0.5s;"></span>
    <span class="streak" style="left: 44%; animation-duration: 2.9s; animation-delay: 1.8s;"></span>
    <span class="streak" style="left: 56%; animation-duration: 3.6s; animation-delay: 0.3s;"></span>
    <span class="streak" style="left: 68%; animation-duration: 2.5s; animation-delay: 1.5s;"></span>
    <span class="streak" style="left: 79%; animation-duration: 3.9s; animation-delay: 0.8s;"></span>
    <span class="streak" style="left: 91%; animation-duration: 3.1s; animation-delay: 2.0s;"></span>
</div>

<!-- Top bar -->
<header class="relative z-10 flex items-start justify-between px-6 pt-6 leading-tight text-xs sm:text-lg md:text-2xl"
        style="font-family: 'Sekuya', sans-serif;">
    <a href="/"
       class="rounded-sm hover:underline"
       style="color: #618764;">
        [ BACK TO DECEMBER ]
    </a>
    <span style="color: #618764;">[ NOVEMBER 2026 ]</span>
</header>

<!-- Center Spring Boot Controls -->
<main class="relative z-10 flex flex-col items-center justify-center px-4 my-auto space-y-6">
    <div th:if="${sent}"
         class="px-5 py-2.5 rounded-full text-xs font-mono border"
         style="background-color: rgba(13, 26, 21, 0.85); border-color: #618764; color: #ffb3d6;">
        STATUS: Message saved in Spring Boot! View on <a href="/" class="underline font-bold">Dashboard Alerts</a>.
    </div>

    <div class="flex flex-wrap items-center justify-center gap-4">
        <form action="/portfolio/olivenn/interact" method="post">
            <button type="submit"
                    class="px-6 py-2.5 rounded-full text-xs font-bold uppercase tracking-widest transition transform hover:scale-105 cursor-pointer"
                    style="background-color: rgba(255, 0, 119, 0.15); border: 1px solid #ff0077; color: #ffb3d6; font-family: 'Sekuya', sans-serif;">
                VOUCH (<span th:text="${count}">0</span>)
            </button>
        </form>

        <details class="relative">
            <summary class="px-6 py-2.5 rounded-full text-xs font-bold uppercase tracking-widest cursor-pointer transition hover:opacity-80"
                     style="background-color: rgba(97, 135, 100, 0.2); border: 1px solid #618764; color: #9CB080; font-family: 'Sekuya', sans-serif;">
                LEAVE MESSAGE
            </summary>

            <form action="/feedback" method="post"
                  class="mt-3 p-5 rounded-2xl w-80 space-y-3 shadow-2xl"
                  style="background-color: #0a1410; border: 1px solid #618764;">
                <input type="hidden" name="recipient" value="Olivenn" />
                <input type="text" name="name" required placeholder="Your Name"
                       class="w-full rounded-lg p-2 text-xs text-white outline-none"
                       style="background-color: #13241d; border: 1px solid #618764;" />
                <input type="email" name="email" required placeholder="Your Email"
                       class="w-full rounded-lg p-2 text-xs text-white outline-none"
                       style="background-color: #13241d; border: 1px solid #618764;" />
                <textarea name="message" required rows="2" placeholder="Write a message..."
                          class="w-full rounded-lg p-2 text-xs text-white outline-none"
                          style="background-color: #13241d; border: 1px solid #618764;"></textarea>
                <button type="submit"
                        class="w-full py-2 rounded-lg text-xs font-bold uppercase tracking-wider text-black cursor-pointer"
                        style="background-color: #ff0077;">
                    Send to Spring Boot
                </button>
            </form>
        </details>
    </div>
</main>

<!-- Main name pinned to the bottom edge -->
<div class="relative z-10 flex items-center justify-center px-4 pb-5">
    <h1 id="olivenn-name" class="m-0 font-normal shimmer-title">
        Jahn Olivenn Esmarin
    </h1>
</div>

<script src="/js/lightfall.js" defer></script>
</body>
</html>
